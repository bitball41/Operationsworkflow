<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#ffd6e7">
    <meta name="description" content="Private AI voice-agent agency operations dashboard">
    <title>Voice Agency Operations</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./styles/tokens.css">
    <link rel="stylesheet" href="./styles/base.css">
    <link rel="stylesheet" href="./styles/layout.css">
    <link rel="stylesheet" href="./styles/components.css">
  </head>
  <body>
    <div id="app" class="app">
      <aside id="sidebar" class="sidebar" aria-label="Navigation">
        <div class="sidebar__top">
          <a class="wordmark" href="#/my-day">Connor <small>/ Voice Operations</small></a>
          <button id="sidebar-collapse" class="icon-btn only-desktop" type="button" data-icon="sidebar" aria-label="Collapse navigation"></button>
          <button id="sidebar-close" class="icon-btn only-mobile" type="button" data-icon="x" aria-label="Close navigation"></button>
        </div>
        <nav id="nav" class="nav"></nav>
        <div id="sidebar-foot" class="sidebar__foot"></div>
      </aside>

      <button id="scrim" class="scrim" type="button" aria-label="Close navigation" hidden></button>

      <div class="main">
        <header class="topbar">
          <button id="menu-open" class="icon-btn only-mobile" type="button" data-icon="menu" aria-label="Open navigation"></button>
          <h1 id="page-title">My Day</h1>
          <div class="topbar__right">
            <button id="palette-open" class="search-btn" type="button">
              <span data-icon="search"></span>
              <span class="only-desktop">Search</span>
              <kbd class="only-desktop">⌘K</kbd>
            </button>
            <a class="icon-btn" href="#/assistant" data-icon="sparkle" aria-label="AI Assistant"></a>
          </div>
        </header>

        <main id="page" class="page" tabindex="-1"></main>
      </div>
    </div>

    <div id="modal-root"></div>
    <div id="drawer-root"></div>
    <div id="palette-root"></div>
    <div id="toasts" class="toasts" aria-live="polite"></div>

    <!-- OpenScout's proven discovery engine stays as classic, dependency-free
         browser modules. The adapter reads its API from window.OpenScout. -->
    <script src="./js/services/openscout/classify.js"></script>
    <script src="./js/services/openscout/verify.js"></script>
    <script src="./js/services/openscout/location.js"></script>
    <script src="./js/services/openscout/storage.js"></script>
    <script src="./js/services/openscout/google-places.js"></script>
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
